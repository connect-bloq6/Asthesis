# AWS Amplify: set "Monorepo application root" to apps/web, or run from repo root with these paths.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd ../..
        - npm ci
    build:
      commands:
        - npm run build -w web
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - ../../node_modules/**/*
