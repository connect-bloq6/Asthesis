# AWS Amplify Hosting (monorepo): must live at repo root when "My app is a monorepo" is enabled.
# Set AMPLIFY_MONOREPO_APP_ROOT on each Amplify app: apps/web (marketing) or apps/admin (portal).
# buildPath: / runs npm from the monorepo root so workspaces resolve.
version: 1
applications:
  - appRoot: apps/web
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            # Amplify Hosting: console env vars are not available to Next.js API/SSR Lambdas unless
            # they are present at build time. See https://docs.aws.amazon.com/amplify/latest/userguide/ssr-environment-variables.html
            - rm -f apps/web/.env.production
            - env | grep -e '^SUPABASE_SERVICE_ROLE_KEY=' >> apps/web/.env.production
            - env | grep -e '^FIGMA_ACCESS_TOKEN=' >> apps/web/.env.production || true
            - npm run build -w web
      artifacts:
        baseDirectory: apps/web/.next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*

  - appRoot: apps/admin
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build -w admin
      artifacts:
        baseDirectory: apps/admin/.next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
